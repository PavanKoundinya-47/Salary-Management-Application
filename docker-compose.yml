services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salary_dev_password}
    ports: [ "5433:5432" ]
    volumes: [ "salary_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U salary_app -d salary_management" ]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://salary_app:${POSTGRES_PASSWORD:-salary_dev_password}@db:5432/salary_management
      CORS_ORIGINS: http://localhost:5174
    ports: [ "8001:8000" ]
    depends_on:
      db: { condition: service_healthy }
  seed:
    build: ./backend
    command: [ "python", "seed.py" ]
    environment:
      DATABASE_URL: postgresql+psycopg://salary_app:${POSTGRES_PASSWORD:-salary_dev_password}@db:5432/salary_management
    depends_on:
      db: { condition: service_healthy }
    profiles: [ "seed" ]
volumes:
  salary_data:
